<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Alhasan's self-hosted project signal</title>
  <desc id="desc">An animated Nulx-inspired signal panel for Linux, networks, security and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c12"/><stop offset="1" stop-color="#101925"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#3cf3ff"/><stop offset=".55" stop-color="#3178ff"/><stop offset="1" stop-color="#b345ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes travel{from{stroke-dashoffset:0}to{stroke-dashoffset:-80}}@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}.pulse{animation:pulse 2.2s ease-in-out infinite}.p2{animation-delay:.55s}.p3{animation-delay:1.1s}.p4{animation-delay:1.65s}.travel{animation:travel 3.5s linear infinite}.sweep{animation:sweep 6s linear infinite}</style>
  <rect x="1" y="1" width="1198" height="248" rx="20" fill="url(#bg)" stroke="#293645" stroke-width="2"/>
  <path class="travel" d="M255 126H1020" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 12" opacity=".55"/>
  <g class="sweep" opacity=".16"><rect width="120" height="250" fill="#3cf3ff" transform="skewX(-16)"/></g>
  <g font-family="Consolas,Menlo,monospace">
    <text x="42" y="54" fill="#91a4b8" font-size="15" letter-spacing="3">SIGNAL // REPO-NATIVE</text>
    <text x="42" y="98" fill="#f3f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Systems in motion</text>
    <text x="42" y="132" fill="#7ee7ef" font-size="15">BUILD · VERIFY · HARDEN</text>
    <text x="42" y="184" fill="#91a4b8" font-size="14">CURRENT</text>
    <text x="42" y="211" fill="#e8eef5" font-size="17">Nulx Linux / private R&amp;D</text>
    <g text-anchor="middle" font-size="14">
      <circle class="pulse" cx="360" cy="126" r="11" fill="#3cf3ff" filter="url(#glow)"/><text x="360" y="172" fill="#c9d4df">LINUX</text>
      <circle class="pulse p2" cx="555" cy="126" r="11" fill="#3178ff" filter="url(#glow)"/><text x="555" y="172" fill="#c9d4df">NETWORKS</text>
      <circle class="pulse p3" cx="750" cy="126" r="11" fill="#b345ff" filter="url(#glow)"/><text x="750" y="172" fill="#c9d4df">SECURITY</text>
      <circle class="pulse p4" cx="945" cy="126" r="11" fill="#3cf3ff" filter="url(#glow)"/><text x="945" y="172" fill="#c9d4df">AUTOMATION</text>
    </g>
    <g transform="translate(1070 55)"><path d="M42 0 80 22v44L42 88 4 66V22Z" fill="#11161d" stroke="#293645" stroke-width="3"/><path d="M23 67V21l38 46V21" fill="none" stroke="url(#line)" stroke-width="9"/><circle class="pulse" cx="73" cy="8" r="4" fill="#3cf3ff"/></g>
  </g>
</svg>