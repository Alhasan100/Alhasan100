<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Alhasan Al-Hmondi — cybersecurity, Linux and infrastructure</title>
  <desc id="desc">An animated Nulx-inspired obsidian banner with cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a0f"/><stop offset=".55" stop-color="#101722"/><stop offset="1" stop-color="#09101a"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3cf3ff"/><stop offset=".55" stop-color="#3178ff"/><stop offset="1" stop-color="#b345ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3cf3ff" stop-opacity=".28"/><stop offset="1" stop-color="#3cf3ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ba0b7" stroke-opacity=".08"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>
  <style>@keyframes scan{from{transform:translateX(-430px)}to{transform:translateX(1380px)}}@keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,14px)}}@keyframes dash{to{stroke-dashoffset:-80}}.scan{animation:scan 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.drift{animation:drift 8s ease-in-out infinite}.dash{animation:dash 4s linear infinite}</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="drift" cx="1090" cy="70" r="250" fill="url(#glow)" filter="url(#blur)"/><circle cx="170" cy="330" r="185" fill="#b345ff" fill-opacity=".08" filter="url(#blur)"/>
    <path class="dash" d="M0 292C192 235 273 350 452 286S731 213 897 264s219 27 303-3" fill="none" stroke="url(#edge)" stroke-opacity=".32" stroke-width="2" stroke-dasharray="9 14"/>
    <g transform="translate(78 66)"><path d="M112 0 214 59v118l-102 59L10 177V59Z" fill="#11161d" stroke="#293645" stroke-width="8"/><path d="M61 181V55l102 126V55" fill="none" stroke="url(#edge)" stroke-width="25" stroke-linecap="square" stroke-linejoin="round"/><path d="M72 202h80" stroke="#b345ff" stroke-width="6" stroke-linecap="round" opacity=".78"/><circle class="pulse" cx="196" cy="25" r="5" fill="#3cf3ff"/></g>
    <g transform="translate(350 82)"><text y="30" fill="#91a4b8" font-family="Consolas,Menlo,monospace" font-size="16" letter-spacing="4">IDENTITY // ALHASAN100</text><text y="100" fill="#f3f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="1">ALHASAN AL-HMONDI</text><rect y="124" width="650" height="3" rx="2" fill="url(#edge)"/><text y="174" fill="#c6d0dc" font-family="Segoe UI,Arial,sans-serif" font-size="23">Cybersecurity · Linux · Networks · Infrastructure</text><g transform="translate(0 214)"><circle class="pulse" cx="7" cy="-5" r="7" fill="#3cf3ff"/><text x="26" fill="#7ee7ef" font-family="Consolas,Menlo,monospace" font-size="16" letter-spacing="2">BUILDING RESILIENT SYSTEMS</text></g></g>
    <g class="scan"><rect x="0" width="210" height="360" fill="url(#edge)" opacity=".05" transform="skewX(-18)"/><line x1="210" y1="0" x2="95" y2="360" stroke="#3cf3ff" stroke-opacity=".22"/></g>
    <path d="M26 56V26h30M1144 26h30v30M26 304v30h30M1144 334h30v-30" fill="none" stroke="#3cf3ff" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
